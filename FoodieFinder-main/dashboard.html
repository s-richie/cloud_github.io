<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FoodieFinder Admin</title>
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="images/FoodieFinder Logo's.png" width="200px">
        </div>
        <div class="links"><img src="images/Dashboard (TRANSP) .png" width="30px"><a href="dashboard.html">Dashboard</a></div>
        <div class="links"><img src="images/Menu (TRANSP) .png" width="30px"><a href="menu.html">Menu</a></div>
        <div class="links"><img src="images/Cloche (TRANSP) .png" width="30px"><a href="orders.html">Orders</a></div>
        <div class="links"><img src="images/Settings (TRANSP) .png" width="30px"><a href="settings.html">Settings</a></div>
        <div class="logout" id="logoutBtn"><img src="images/Log out (TRANSP) .png" width="30px"><a href="">Logout</a></div>
    </div>
    <header class="header">
        <div class="header-content">
            <h1>Analytics</h1>
        </div>
    </header>
    <div class="dashboard-container" id="dashboard-container">
        <div class="img"><img src="images/Analytics (Image).png"></div>
        <div class="orders">
            <table border="1">
                <tr>Orders</tr>
                <tr class="contents">
                    <th>Total Orders</th>
                    <th>Total Products</th>
                    <th>Total Sales</th>
                </tr>
                <tr>
                    <th id="totalOrders">0</th>
                    <th id="totalProducts">0</th>
                    <th id="totalSales">0</th>
                </tr>
            </table>
        </div>
        <div class="products">
            <table border="1">
                <tr>Products</tr>
                <tr>
                    <td id="productOne">Product A</td>
                    <td id="productTwo">Product B</td>
                    <td id="productThree">Product C</td>
                    <td id="productFour">Product D</td>
                    <td>Total Sales</td>
                </tr>
                <tr>
                    <th id="productOneSales">0</th>
                    <th id="productTwoSales">0</th>
                    <th id="productThreeSales">0</th>
                    <th id="productFourSales">0</th>
                    <th id="totalSalesTwo">0</th>
                </tr>
            </table>
        </div>
    </div>
    <script>
        function checkAuthentication() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
            }
        }

        function fetchDashboard() {
            const shopId = localStorage.getItem("shop_id");
            fetch(`http://localhost/FFproject/FoodieFinder/api/owner-dashboard?shop_id=${shopId}`, {
                method: "GET",
                headers: { "ngrok-skip-browser-warning": "true" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 200) {
                    document.getElementById("totalOrders").textContent = data.data.total_orders || 0;
                    document.getElementById("totalProducts").textContent = data.data.total_products || 0;
                    document.getElementById("totalSales").textContent = data.data.total_sales || 0;
                    document.getElementById("totalSalesTwo").textContent = data.data.total_sales || 0;

                    const products = Object.values(data.data.products);
                    const productElements = [
                        { name: "productOne", sales: "productOneSales" },
                        { name: "productTwo", sales: "productTwoSales" },
                        { name: "productThree", sales: "productThreeSales" },
                        { name: "productFour", sales: "productFourSales" }
                    ];
                    productElements.forEach((productElement, index) => {
                        const productNameElement = document.getElementById(productElement.name);
                        const productSalesElement = document.getElementById(productElement.sales);

                        if (products[index]) {
                            productNameElement.textContent = products[index].product_name || "N/A";
                            productSalesElement.textContent = products[index].sales || 0;

                            productNameElement.style.display = "table-cell";
                            productSalesElement.style.display = "table-cell";
                        } else {
                            productNameElement.style.display = "none";
                            productSalesElement.style.display = "none";
                        }
                    });
                    } else {
                        console.error("Error fetching dashboard", data.message);
                    } 
            })
            .catch(error => {
                console.error("Error fetching dashboard", error);
            });
        }

        document.addEventListener("DOMContentLoaded", async function() {
            const logoutBtn = document.getElementById("logoutBtn");
            checkAuthentication();
            fetchDashboard();

            logoutBtn.addEventListener("click", function() {
                localStorage.removeItem("token");
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
