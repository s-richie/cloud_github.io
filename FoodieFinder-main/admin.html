<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FoodieFinder Admin</title>
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="images/FoodieFinder Logo's.png" width="200px">
        </div>
        <div class="links"><a href="admin.html">Dashboard</a></div>
        <div class="links"><a href="shop_documents.html">Shop documents</a></div>
        <div class="logout" id="LogoutBtn"><img src="images/Log out (TRANSP) .png" width="30px"><a href="">Logout</a></div>
    </div>
    <header class="header">
        <div class="header-content">
            <h1>Admin</h1>
        </div>
    </header>
    <div class="dashboard-container" id="dashboard-container">
        <div class="img"><img src="images/Analytics (Image).png"></div>
        <div class="main-content">
            <div class="overview">
                <h3><strong>Overview</strong></h3>
                <div class="overview-cards">
                    <div class="card"><p>Total Registered Shops</p><p id="totalRegistered">0</p></div>
                    <div class="card"><p>Total Approved Shops</p><p id="totalApproved">0</p></div>
                    <div class="card"><p>Total Declined Shops</p><p id="totalDeclined">0</p></div>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Enter shop name or email" onkeyup="filterShops()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Shop Name</th>
                        <th>Actions</th>
                        <th>Select</th>
                    </tr>
                </thead>
                <tbody id="shopTableBody"></tbody>
            </table>
            <div class="actions">
                <button class="approve-selected" onclick="approveSelected()">Approve Selected</button>
                <button class="decline-selected" onclick="declineSelected()">Decline Selected</button>
            </div>
        </div>
    </div>
    <script>
        let shopsData = [];

        document.addEventListener("DOMContentLoaded", function () {
            fetchDashboard();
            fetchShops();
        });

        function fetchShops() {
            fetch("http://localhost/FFproject/FoodieFinder/api/unverified-shops", {
                method: "GET",
                headers: { "ngrok-skip-browser-warning": "true" }
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(rawError => {
                        console.error("Raw error response:", rawError);
                        throw new Error(`Network response was not ok. Status: ${response.status}, StatusText: ${response.statusText}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 200 && Array.isArray(data.data)) {
                    shopsData = data.data;
                    renderShops(shopsData);
                } else {
                    console.error("Error fetching shops:", data.message || "Invalid data format");
                    document.getElementById("shopTableBody").innerHTML = "<tr><td colspan='4'>No shops found.</td></tr>";
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
                document.getElementById("shopTableBody").innerHTML = "<tr><td colspan='4'>Error loading shops.</td></tr>";
            });
        }

        function fetchDashboard() {
            fetch("http://localhost/FFproject/FoodieFinder/api/admin-dashboard", {
                method: "GET",
                headers: { "ngrok-skip-browser-warning": "true" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 200) {
                    document.getElementById("totalRegistered").textContent = data.data.total_shops || 0;
                    document.getElementById("totalApproved").textContent = data.data.total_approved_shops || 0;
                    document.getElementById("totalDeclined").textContent = data.data.total_declined_shops || 0;
                } else {
                    console.error("Error fetching dashboard", data.message);
                }
            })
            .catch(error => {
                console.error("Error fetching dashboard", error);
            });
        }

        function renderShops(shops) {
            const tableBody = document.getElementById("shopTableBody");
            tableBody.innerHTML = "";
            shops.forEach(shop => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${shop.email || "N/A"}</td>
                    <td>${shop.shop_name || "N/A"}</td>
                    <td>
                        <button class="approve" data-id="${shop.owner_id}" onclick="approveShop(${shop.owner_id}, this)">Approve</button>
                        <button class="decline" data-id="${shop.owner_id}" onclick="declineShop(${shop.owner_id}, this)">Decline</button>
                    </td>
                    <td><input type="checkbox" data-id="${shop.owner_id}"></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function filterShops() {
            const searchValue = document.getElementById("searchInput").value.toLowerCase();
            const filteredShops = shopsData.filter(shop => 
                (shop.shop_name && shop.shop_name.toLowerCase().includes(searchValue)) || 
                (shop.email && shop.email.toLowerCase().includes(searchValue))
            );
            renderShops(filteredShops);
        }

        function approveShop(shopOwnerId, button) {
            fetch("http://localhost/FFproject/FoodieFinder/api/approve-shop", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ shop_owner_id: shopOwnerId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 200) {
                    alert("Shop approved successfully!");
                    fetchDashboard();
                    fetchShops();
                } else {
                    alert("Failed to approve shop: " + data.message);
                }
            })
            .catch(error => {
                console.error("Error approving shop:", error);
                alert("An error occurred while approving the shop.");
            });
        }

        function declineShop(shopOwnerId, button) {
            fetch("http://localhost/FFproject/FoodieFinder/api/decline-shop", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ shop_owner_id: shopOwnerId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 200) {
                    alert("Shop declined successfully!");
                    fetchDashboard();
                    fetchShops();
                } else {
                    alert("Failed to decline shop: " + data.message);
                }
            })
            .catch(error => {
                console.error("Error declining shop:", error);
                alert("An error occurred while declining the shop.");
            });
        }

        function approveSelected() {
            const selectedCheckboxes = Array.from(document.querySelectorAll("#shopTableBody input[type='checkbox']:checked"));
            const selectedIds = selectedCheckboxes.map(cb => cb.getAttribute("data-id"));
            if (selectedIds.length === 0) {
                alert("No shops selected!");
                return;
            }

            Promise.all(selectedIds.map(id => 
                fetch("http://localhost/FFproject/FoodieFinder/api/approve-shop", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ shop_owner_id: id })
                }).then(response => response.json())
            ))
            .then(results => {
                const allSuccess = results.every(result => result.status === 200);
                if (allSuccess) {
                    alert("Selected shops approved successfully!");
                    fetchDashboard();
                    fetchShops();
                } else {
                    const failedMessages = results.filter(r => r.status !== 200).map(r => r.message).join(", ");
                    alert("Some approvals failed: " + failedMessages);
                }
            })
            .catch(error => {
                console.error("Error approving selected shops:", error);
                alert("An error occurred while approving selected shops.");
            });
        }

        function declineSelected() {
            const selectedCheckboxes = Array.from(document.querySelectorAll("#shopTableBody input[type='checkbox']:checked"));
            const selectedIds = selectedCheckboxes.map(cb => cb.getAttribute("data-id"));
            if (selectedIds.length === 0) {
                alert("No shops selected!");
                return;
            }

            Promise.all(selectedIds.map(id => 
                fetch("http://localhost/FFproject/FoodieFinder/api/decline-shop", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ shop_owner_id: id })
                }).then(response => response.json())
            ))
            .then(results => {
                const allSuccess = results.every(result => result.status === 200);
                if (allSuccess) {
                    alert("Selected shops declined successfully!");
                    fetchDashboard();
                    fetchShops();
                } else {
                    const failedMessages = results.filter(r => r.status !== 200).map(r => r.message).join(", ");
                    alert("Some declines failed: " + failedMessages);
                }
            })
            .catch(error => {
                console.error("Error declining selected shops:", error);
                alert("An error occurred while declining selected shops.");
            });
        }
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("id");
            window.location.href = "login.html";
        }
        document.getElementById("LogoutBtn").addEventListener("click", function() {
            logout();
        });
        function checkAuthentication() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
            }
        }
        document.addEventListener("DOMContentLoaded", function() {
            checkAuthentication();
        });
        document.getElementById("LogoutBtn").addEventListener("click", function() {
            logout();
        });
    </script>
</body>
</html>
