<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b949e;
            font-size: 15px;
        }

        .cv-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cv-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 18px 20px;
            text-decoration: none;
            color: white;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .cv-item:hover {
            background: #21262d;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .cv-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .cv-name {
            font-size: 17px;
            font-weight: 600;
        }

        .arrow {
            font-size: 22px;
            color: #8b949e;
        }

        .cv-item:hover .arrow {
            color: #58a6ff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>CV Collection</h1>
        <p>Select a CV to view the document</p>
    </div>

    <div class="cv-list">

        <div class="cv-item" onclick="viewCV('Aaron_Abad_CV')">
            <div class="cv-left">
                <div class="cv-name">Aaron Abad CV</div>
            </div>
            <div class="arrow">→</div>
        </div>

        <div class="cv-item" onclick="viewCV('CarlJustine_Petrola_CV')">
            <div class="cv-left">
                
                <div class="cv-name">Carl Justine Petrola CV</div>
            </div>
            <div class="arrow">→</div>
        </div>

        <div class="cv-item" onclick="viewCV('Lopez_CV')">
            <div class="cv-left">
               
                <div class="cv-name">Lopez CV</div>
            </div>
            <div class="arrow">→</div>
        </div>

        <div class="cv-item" onclick="viewCV('Suniga_CV')">
            <div class="cv-left">
                
                <div class="cv-name">Suniga CV</div>
            </div>
            <div class="arrow">→</div>
        </div>

        <div class="cv-item" onclick="viewCV('villariaza_cv')">
            <div class="cv-left">
                
                <div class="cv-name">Villariaza CV</div>
            </div>
            <div class="arrow">→</div>
        </div>

    </div>

</div>

<script>
async function viewCV(fileName) {

    try {
        // Get the CV file
        const response = await fetch(fileName);

        if (!response.ok) {
            throw new Error("CV file not found");
        }

        // Read the file
        const data = await response.arrayBuffer();

        // Tell the browser that the file is a PDF
        const pdfBlob = new Blob([data], {
            type: "application/pdf"
        });

        // Create a temporary URL
        const pdfURL = URL.createObjectURL(pdfBlob);

        // Open PDF in a new tab
        window.open(pdfURL, "_blank");

    } catch (error) {
        alert("Unable to open this CV.");
        console.error(error);
    }
}
</script>

</body>
</html>
