<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b949e;
            font-size: 15px;
        }

        .cv-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cv-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 18px 20px;
            text-decoration: none;
            color: white;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .cv-item:hover {
            background: #21262d;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .cv-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .cv-name {
            font-size: 17px;
            font-weight: 600;
        }

        .arrow {
            font-size: 22px;
            color: #8b949e;
        }

        .cv-item:hover .arrow {
            color: #58a6ff;
        }
    </style>
    
</head>

<body>

<!-- Aaron Abad -->
<a href="Aaron_Abad_CV" target="_blank" class="cv-item">
    <div class="cv-left">
        <div>
            <div class="cv-name">Aaron Abad CV</div>
        </div>
    </div>
    <div class="arrow">→</div>
</a>
