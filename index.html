<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b949e;
            font-size: 15px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        li {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 18px 20px;
            transition: 0.25s ease;
        }

        li:hover {
            background: #21262d;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
        }

        a:hover {
            color: #58a6ff;
        }
    </style>
</head>

</html>
